<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtual Chemistry Lab</title>
<style>
:root{--bg:#eef2fb;--pan:#ffffff;--tx:#18203a;--mut:#667191;--bd:#d6ddf0;--acc:#3b5bdb;--acc2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--chip:#eef1fb;--ws1:#f7faff;--ws2:#dfe9fb;--wall1:#e6edf8;--wall2:#c9d6ec;--bench1:#b98a5a;--bench2:#8a5a33;--glass:rgba(255,255,255,.35);--glassb:#7e8fb5}
[data-theme=dark]{--bg:#0e1320;--pan:#161c2d;--tx:#e6eaf3;--mut:#9aa6bd;--bd:#2a3349;--acc:#6b8bff;--acc2:#a78bfa;--chip:#222b42;--ws1:#1a2340;--ws2:#0f1630;--wall1:#232c48;--wall2:#161d36;--bench1:#7a5530;--bench2:#4d3219;--glass:rgba(255,255,255,.1);--glassb:#8ea0c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.lab{display:grid;height:100vh;height:100dvh;grid-template-columns:240px 1fr 320px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "tool ws pan"}
.top{grid-area:top;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--pan);border-bottom:1px solid var(--bd)}
.top h1{font-size:15px;margin:0 auto 0 0}
.btn{border:1px solid var(--bd);background:var(--chip);border-radius:10px;padding:6px 10px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,.14),0 5px 8px rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.danger{color:var(--bad)}
.btn[disabled],.uc{opacity:.55}
.warp{display:flex;gap:3px;align-items:center}.warp span{font-size:12px;color:var(--mut);margin-right:2px}
.warp .btn{padding:4px 8px}
.tool{grid-area:tool;background:var(--pan);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}
.tabs button{border:0;background:var(--chip);border-radius:8px;padding:6px 10px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff}
.tbody{overflow:auto;padding:8px;flex:1;min-height:0}
.search{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-bottom:6px}
.amt{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;font-size:12px;color:var(--mut)}
.amt button{border:1px solid var(--bd);background:var(--chip);border-radius:999px;padding:3px 8px;font-size:12px}
.amt button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{box-shadow:0 3px 0 rgba(0,0,0,.14),0 6px 10px rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:1px solid var(--bd);background:var(--chip);border-radius:10px;padding:8px 4px;font-size:12px;user-select:none;-webkit-user-select:none;touch-action:pan-y;position:relative;min-height:62px}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.card .ic{font-size:22px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.card small{color:var(--mut);font-size:11px}
.card.bot{min-height:128px;gap:3px;justify-content:flex-start;padding-top:6px}.card.bot .bsvg{height:100px;display:flex;align-items:flex-end;justify-content:center}.card.bot .bsvg svg{width:54px;height:84px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.28))}
.ghost.bt{background:none;box-shadow:none;padding:0;transform:translate(-50%,-70%) rotate(-12deg)}.ghost.bt svg{width:48px;height:75px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.card.on{border-color:var(--acc2);box-shadow:0 0 0 2px var(--acc2) inset}
.card.uc{border-style:dashed}
.card .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--glassb)}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:6px 10px;background:var(--acc);color:#fff;border-radius:10px;font-weight:700;transform:translate(-50%,-120%);box-shadow:0 6px 18px #0005;font-size:12px}
.ws{grid-area:ws;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#ffffff22,transparent 60%),linear-gradient(var(--ws1),var(--ws2));min-height:0;touch-action:none;}
.wall{position:absolute;left:0;right:0;top:0;height:var(--wallh,24%);background:linear-gradient(#0000,#0003),repeating-linear-gradient(0deg,#0000 0 38px,#0000001a 38px 40px),repeating-linear-gradient(90deg,#0000 0 58px,#0000001a 58px 60px),linear-gradient(var(--wall1),var(--wall2));pointer-events:none;box-shadow:inset 0 -12px 20px #0003}
.bench{position:absolute;left:0;right:0;bottom:0;top:calc(var(--wallh,24%) - 6px);overflow:hidden;background:linear-gradient(var(--bench2),var(--bench1) 30%,var(--bench1) 70%,var(--bench2));box-shadow:inset 0 14px 22px #00000066;pointer-events:none}
.bench::before{content:"";position:absolute;left:-70%;right:-70%;top:0;bottom:0;background:repeating-linear-gradient(90deg,#00000026 0 2px,#ffffff12 2px 4px,transparent 4px 64px),repeating-linear-gradient(0deg,#0000 0 60px,#0000000f 60px 62px);transform:perspective(520px) rotateX(46deg);transform-origin:50% 100%}
.bench::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(#e6bd8a,#c99560 35%,#5a3519 36%,#3f240f);box-shadow:0 -2px 0 #ffffff55 inset}
.trash{z-index:5;position:absolute;right:10px;top:10px;width:58px;height:58px;border:2px dashed var(--mut);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mut);opacity:.7}
.trash.hot{background:#dc262633;border-color:var(--bad);opacity:1}
.hint{z-index:1;position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;color:var(--mut);max-width:70%;pointer-events:none}
.hint b{display:block;font-size:16px;margin-bottom:4px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:8px 14px;border-radius:10px;z-index:30;max-width:80%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.status{z-index:5;position:absolute;left:10px;top:10px;font-size:12px;color:var(--mut);background:var(--pan);border:1px solid var(--bd);padding:4px 8px;border-radius:8px;max-width:60%}
.it{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.it.sel svg{filter:drop-shadow(0 0 3px var(--acc2)) drop-shadow(0 0 6px var(--acc2))}
.it.drag{cursor:grabbing}
.it.drag .vessel{transform:translateY(-8px) scale(1.04)}
.it.drag .shadow{transform:scale(1.25);opacity:.5}
.it.pourable svg{filter:drop-shadow(0 0 4px var(--ok)) drop-shadow(0 0 8px var(--ok))}
.it.mounted .lbl,.it.mounted .shadow{display:none}
.it.tilt .vessel{transform:rotate(-24deg);transform-origin:50% 92%}
.it.burning .vessel{filter:brightness(1.7) drop-shadow(0 0 16px #fff)}
.it.lit .vessel{filter:drop-shadow(0 0 16px #5aa7ff88)}
.vessel{position:relative;transition:transform .15s,filter .15s}
.vessel svg{display:block;overflow:visible;position:absolute;left:0;top:0}
.svgh,.rodl{position:absolute;inset:0}
.rodl{pointer-events:none}.rodl .rodhit{pointer-events:stroke}
.shadow{position:absolute;left:6%;right:6%;bottom:6px;height:16px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,.2) 55%,transparent 72%);transition:transform .15s,opacity .15s;pointer-events:none}
.bubs{position:absolute;overflow:hidden;pointer-events:none}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffffffaa 45%,#ffffff44);border:1px solid #ffffffcc;animation:rise 1.4s linear forwards;bottom:0}
@keyframes rise{to{transform:translateY(var(--rise,-100px));opacity:.1}}
.flb,.fly{display:none;transform-box:fill-box;transform-origin:50% 100%}
.it.lit .flb{display:block;opacity:var(--ob,1);animation:flick .16s infinite alternate}
.it.lit .fly{display:block;opacity:var(--oy,0);animation:flick .28s infinite alternate}
@keyframes flick{from{transform:scale(1,calc(var(--fh,1)*.93)) skewX(-2deg)}to{transform:scale(.96,calc(var(--fh,1)*1.06)) skewX(2deg)}}
.it.stirring .rodl{animation:stirrod .55s linear infinite}
@keyframes stirrod{0%{transform:translate(0,0)}25%{transform:translate(9px,2px)}50%{transform:translate(0,4px)}75%{transform:translate(-9px,2px)}100%{transform:translate(0,0)}}
.rodl .sw{display:none}.it.stirring .rodl .sw{display:block;animation:swd .6s linear infinite}
@keyframes swd{to{stroke-dashoffset:-32}}
.plume{position:absolute;height:12px;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,var(--c),transparent 70%);filter:blur(3px);opacity:var(--a);animation:plume 2.4s ease-out forwards;pointer-events:none}
@keyframes plume{0%{opacity:var(--a);transform:scale(.5,.5)}100%{opacity:0;transform:translateY(52px) scale(1.3,4.5)}}
.steam{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ffffffcc,#ffffff00 70%);filter:blur(2px);animation:steam 1.8s ease-out forwards;pointer-events:none}
@keyframes steam{from{opacity:.8;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(8px,-58px) scale(2.2)}}
.pbot{position:absolute;left:0;top:0;width:64px;height:100px;transform-origin:32px 10px;z-index:900;pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .3s;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
.stream{position:absolute;width:5px;z-index:899;pointer-events:none;border-radius:3px;background:linear-gradient(90deg,#ffffff88,var(--c),#ffffff55);opacity:.9;box-shadow:0 0 3px #ffffff88}
.drop{position:absolute;z-index:899;width:6px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);border:1px solid #ffffffaa;pointer-events:none;animation:fall .55s cubic-bezier(.5,0,1,.6) forwards}
.grain{position:absolute;z-index:899;width:4px;height:4px;border-radius:1px;pointer-events:none;border:1px solid #0004;animation:fall .5s cubic-bezier(.5,0,1,.6) forwards}
@keyframes fall{to{transform:translateY(var(--d))}}
.fr{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(2px 6px 3px rgba(0,0,0,.4))}
.fr.held{cursor:grabbing}
.fr.rod{width:14px;height:150px;transform-origin:7px 148px;transform:translate(-7px,-148px) rotate(24deg)}
.fr.ribbon{width:84px;height:30px;transform:translate(-80px,-16px)}
.fr.nail{width:64px;height:16px;transform:translate(-32px,-8px) rotate(-8deg)}
.fr .gl{position:absolute;left:-40px;top:-28px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 22%,#dfeaffaa 46%,transparent 70%);opacity:0;pointer-events:none}
.fr.burning .gl{opacity:1;animation:glare .1s infinite alternate}
@keyframes glare{from{transform:scale(.9)}to{transform:scale(1.18)}}
.fr.burning{filter:drop-shadow(0 0 22px #fff) drop-shadow(0 0 44px #cfe4ff)}
.ash{position:absolute;width:3px;height:3px;border-radius:50%;background:#f6f6f2;z-index:871;pointer-events:none;animation:fall .75s cubic-bezier(.5,0,1,.6) forwards}
.vessel svg.tongs{display:none;position:absolute;left:8px;top:76px;pointer-events:none;overflow:visible}
.it.inflame .vessel svg.tongs{display:block}
.swl{position:absolute;border:2px dashed rgba(255,255,255,.85);border-radius:50%;display:none;pointer-events:none}
.it.stirring .swl{display:block;animation:swr .5s linear infinite}
@keyframes swr{to{transform:rotate(360deg)}}
.fume{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,rgba(150,70,20,.75),rgba(150,70,20,0) 70%);filter:blur(2px);animation:steam 1.8s ease-out forwards;pointer-events:none}
.ws.hand,.ws.hand .it{cursor:none}
#hc{display:none;position:absolute;font-size:34px;pointer-events:none;z-index:999;transform:translate(-14px,-22px);filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
.sunwin{position:absolute;left:5%;top:9%;width:96px;height:calc(var(--wallh,24%)*.64);border:5px solid #8a6a3a;background:linear-gradient(#bfe4ff,#eaf7ff);box-shadow:inset 0 0 12px #fff,0 3px 8px #0004;pointer-events:none;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:4px}
.sunwin i{background:#dff1ff99}
.beam{position:absolute;left:5%;top:calc(var(--wallh,24%)*.7);width:44%;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,236,150,.55),rgba(255,236,150,.16));clip-path:polygon(0 0,22% 0,100% 100%,40% 100%)}
.dtl{position:absolute;inset:0;width:100%;height:100%;z-index:860;pointer-events:none;overflow:visible}
.dtl .ea,.dtl .eb{pointer-events:auto;cursor:grab}
.elx{position:absolute;left:0;top:0;width:220px;height:192px;pointer-events:none}.elx .swt{pointer-events:all;cursor:pointer}
.lev{transform-origin:100px 176px;transform:rotate(-42deg);transition:transform .15s}.it.on .lev{transform:rotate(0)}
.it.inv .vessel{transform:scaleY(-1)}.it.inv.drag .vessel{transform:scaleY(-1) translateY(8px) scale(1.04)}
.it.pouring .vessel{transform:rotate(var(--tilt,0deg));transform-origin:50% 28%}
.it{pointer-events:none}.it .vessel,.it .lbl,.it .read>span{pointer-events:auto}
.mt{position:absolute;width:16px;height:124px;transform-origin:8px 8px;transform:translate(-8px,-8px) rotate(-30deg);z-index:880;cursor:grab;touch-action:none;filter:drop-shadow(2px 6px 3px rgba(0,0,0,.4))}
.mt.held{cursor:grabbing}.mt.lit{filter:drop-shadow(0 0 10px #ffb340) drop-shadow(2px 6px 3px rgba(0,0,0,.4))}
.mfl{display:none;transform-box:fill-box;transform-origin:50% 100%}
.mt.lit .mfl{display:block;animation:mflick .12s infinite alternate}
@keyframes mflick{from{transform:scale(calc(var(--fs,1)*.92),calc(var(--fs,1)*.88))}to{transform:scale(calc(var(--fs,1)*1.05),calc(var(--fs,1)*1.08))}}
.mt.lit .memb{opacity:1}
.mtray{cursor:grab}.tap{cursor:pointer}
.gw{display:none}.it.gas:not(.lit) .gw{display:block;animation:gw 1s ease-out infinite}
@keyframes gw{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
.tapH{transition:transform .2s;transform-box:fill-box;transform-origin:center}.it.gas .tapH{transform:rotate(90deg)}
.lbl{font-size:11px;font-weight:700;background:var(--pan);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap}
.read{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:150px;margin-bottom:3px;min-height:4px}
.read span.rodchip{background:#374151;color:#e5e7eb}.read span{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:#111827;color:#a7f3d0;font-family:ui-monospace,Menlo,monospace;cursor:pointer}
.read span.paper{color:#111;border:1px solid #0004;min-width:34px;text-align:center}
.flame{position:absolute;bottom:-26px;font-size:22px;display:none;animation:fl .3s infinite alternate}
.it.heat .flame{display:block}
@keyframes fl{to{transform:scale(1.15) translateY(-2px)}}
.pan{grid-area:pan;background:var(--pan);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.pbody{overflow:auto;padding:10px;flex:1;min-height:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--bd)}
.row b{font-variant-numeric:tabular-nums}
.sw2{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--glassb);vertical-align:-2px;margin-right:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.acts .btn{padding:6px 9px;font-size:13px}
.ob{padding:6px 8px;border-radius:8px;background:var(--chip);margin-bottom:5px;font-size:13px}
.ob small{color:var(--mut);display:block}
.rx{padding:8px;border-radius:10px;background:var(--chip);margin-bottom:6px}
.rx b{display:block;font-size:14px}.rx small{color:var(--mut)}
.muted{color:var(--mut)}
.ucb{display:inline-block;font-size:11px;font-weight:700;background:#f59e0b33;color:#b45309;border-radius:6px;padding:1px 6px;margin-left:4px}
[data-theme=dark] .ucb{color:#fbbf24}
textarea,input.t,.search{-webkit-user-select:text;user-select:text}
textarea,input.t{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
@media(max-width:820px){
 .lab{grid-template-columns:1fr;grid-template-rows:auto auto minmax(250px,1fr) 38%;grid-template-areas:"top" "tool" "ws" "pan"}
 .tool{border-right:0;border-bottom:1px solid var(--bd);max-height:205px}
 .tbody{padding:4px 6px}
 .cards{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.card{min-width:92px;flex:none;touch-action:pan-x;min-height:56px}
 .grp{margin:4px 0 2px}.amt{margin:2px 0 4px}
 .top .long,.warp span{display:none}.top{gap:5px;padding:6px;flex-wrap:nowrap;overflow-x:auto}.top .btn,.warp{flex:none}.top h1{margin-right:0}.btn{padding:5px 8px;font-size:12px}
 .pan{border-left:0;border-top:1px solid var(--bd)}
 .top h1{font-size:14px}
 .status{display:none}
}
@media(prefers-reduced-motion:reduce){.bub,.flame{animation:none}}
</style>
</head>
<body>
<div class="lab" id="lab">
 <div class="top">
  <h1>🧪 <span class="long">Virtual Chemistry Lab</span></h1>
  <button class="btn" id="gogBtn">🥽 Goggles: OFF</button>
  <div class="warp"><span>Time</span><button class="btn on" data-w="1">×1</button><button class="btn" data-w="2">×2</button><button class="btn" data-w="5">×5</button><button class="btn" data-w="10">×10</button></div>
  <button class="btn danger" id="resetBtn">🧹 Clear table</button>
 </div>
 <div class="tool">
  <div class="tabs"><button class="on" data-tt="app">Apparatus</button><button data-tt="chem">Chemicals</button></div>
  <div class="tbody" id="tbody"></div>
 </div>
 <div class="ws" id="ws"><div class="wall"></div><div class="bench"></div><div class="sunwin"><i></i><i></i><i></i><i></i></div><div class="beam"></div><div id="hc">✋</div>
  <div class="status" id="status">Tap or drag apparatus onto the bench.</div>
  <div class="hint" id="hint"><b>Your lab table is empty</b>Tap or drag glassware onto the table, and move things anywhere you like. Put on your goggles, then drag a reagent bottle onto a container to pour it (or tap a bottle, then tap the container).</div>
  <div class="trash" id="trash">🗑️</div>
  
  <div class="toast" id="toast"></div>
 </div>
 <div class="pan">
  <div class="tabs" id="ptabs"><button class="on" data-pt="insp">Inspect</button><button data-pt="obs">Observations</button><button data-pt="rx">Reactions</button><button data-pt="exp">Activities</button><button data-pt="nb">Notebook</button></div>
  <div class="pbody" id="pbody"></div>
 </div>
</div>

<script>
/* ================= CHEMISTRY ENGINE (pure functions on container objects) ================= */
const KW=1e-14,KA_HAC=1.8e-5,KA1=4.5e-7,KA2=4.7e-11;
const SUB={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"};
const sub=n=>String(n).split("").map(d=>SUB[d]||d).join("");
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
const co=n=>n===1?"":String(n);
const CATZ={NH4:1,Na:1,K:1,Ag:1,Cu:2,Ba:2,Pb:2,Zn:2,Fe2:2,Fe3:3,Ca:2,Mg:2};
const CATS={NH4:"NH₄",Na:"Na",K:"K",Ag:"Ag",Cu:"Cu",Ba:"Ba",Pb:"Pb",Zn:"Zn",Fe2:"Fe",Fe3:"Fe",Ca:"Ca",Mg:"Mg"};
const ANS={Cl:{f:"Cl",z:1,acid:"HCl",h:1},NO3:{f:"NO₃",z:1,acid:"HNO₃",h:1},SO4:{f:"SO₄",z:2,acid:"H₂SO₄",h:2},Ac:{f:"CH₃COO",z:1,acid:"CH₃COOH",h:1}};
function part(f,n){return n===1?f:(f.length>2&&/[₀-₉]|[A-Z].*[A-Z]/.test(f)?"("+f+")":f)+sub(n)}
function salt(cat,an){const z1=CATZ[cat],z2=ANS[an].z,g=gcd(z1,z2);return {f:part(CATS[cat],z2/g)+part(ANS[an].f,z1/g),ncat:z2/g}}

 {const t=$("trash").getBoundingClientRect();$("trash").classList.toggle("hot",e.clientX>t.left&&e.clientX<t.right&&e.clientY>t.top&&e.clientY<t.bottom)}

function geom(c){const vr=c.el.querySelector(".vessel").getBoundingClientRect(),wr=ws.getBoundingClientRect(),g=GEO[c.type],sc=vr.width/g.W;
 return{cx:vr.left-wr.left+g.cx*sc,rimY:vr.top-wr.top+g.ytop*sc,ys:vr.top-wr.top+levelY(g,c.vol,c.cap)*sc,sc}}
function startPour(ch,c){
 if(!state.gog){toast("🥽 Put on your safety goggles first!");return false}
 const amt=ch.sol?state.amtS:ch.ind?.2:state.amtL;
 if(!ch.sol&&c.vol+amt>c.cap+1e-9){toast(c.label+" would overflow. Pour less or use a bigger container.");return false}
 const el=document.createElement("div");el.className="pbot";el.innerHTML=bottleSVG(ch);ws.appendChild(el);
 const j={ch,c,left:amt,total:amt,done:0,t:0,el,kind:ch.sol?"sol":ch.ind?"drop":"liq",pl:0,sp:0,stream:null};
 pours.push(j);select(c.id);return true;
}
function endPour(j,quiet){
 if(j.el)j.el.remove();if(j.stream)j.stream.remove();pours.splice(pours.indexOf(j),1);
 if(!quiet&&j.done>0){const c=j.c,ch=j.ch;log(c,(ch.sol?j.done.toFixed(1)+" g of "+SOLNAME[ch.id].toLowerCase():ch.ind?"a few drops of "+ch.n:j.done.toFixed(1)+" mL of "+ch.n)+" added");view(c)}
}
function runPours(real){
 for(const j of pours.slice()){
  j.t+=real;const c=j.c;
  if(!c.el||!c.el.isConnected){endPour(j,true);continue}
  const g=geom(c),mx=g.cx+(j.kind==="drop"?0:5*g.sc),my=g.rimY-26*g.sc,s=g.sc*1.02;
  const R=j.kind==="drop"?180:-122;
  j.el.style.transform=`translate(${(mx-32).toFixed(1)}px,${(my-10).toFixed(1)}px) rotate(${j.t>.12?R:-8}deg) scale(${s.toFixed(3)})`;
  j.el.style.opacity=1;
  if(j.t<.5)continue;
  if(j.left>1e-9){
   let d;
   if(j.kind==="liq")d=Math.min(j.left,Math.max(1.4,j.total/2.2)*real);
   else if(j.kind==="drop")d=Math.min(j.left,.2/1.4*real);
   else d=Math.min(j.left,Math.max(.25,j.total/1.3)*real);
   const ok=j.ch.sol?addSolid(c,j.ch.id,d):addLiquid(c,j.ch,d);
   if(!ok){toast(c.label+" is full");j.left=0}else{j.left-=d;j.done+=d}
   /* visuals */
   const col=hex(hx(j.ch.col.length===7?j.ch.col:"#dff0ff"));
   if(j.kind==="liq"){
    if(!j.stream){j.stream=document.createElement("div");j.stream.className="stream";ws.appendChild(j.stream)}
    const top=my+6*g.sc,h=Math.max(0,g.ys-top);
    j.stream.style.cssText=`left:${(mx-2.5).toFixed(1)}px;top:${top.toFixed(1)}px;height:${h.toFixed(1)}px;--c:${col}`;
    j.pl-=real;if(j.pl<=0){j.pl=.55;spawnPlume(c,col,j.ch.id==="water"?.25:.55)}
   }else if(j.kind==="drop"){
    j.sp-=real;if(j.sp<=0){j.sp=.42;const dr=document.createElement("i");dr.className="drop";dr.style.cssText=`left:${mx.toFixed(1)}px;top:${(my+8*g.sc).toFixed(1)}px;--d:${Math.max(10,g.ys-my-10).toFixed(1)}px;--c:${col}`;ws.appendChild(dr);dr.onanimationend=()=>{dr.remove();spawnPlume(c,col,.35)}}
   }else{
    j.sp-=real;if(j.sp<=0){j.sp=.04;for(let i=0;i<2;i++){const gr=document.createElement("i");gr.className="grain";gr.style.cssText=`left:${(mx+Math.random()*8-4).toFixed(1)}px;top:${(my+8*g.sc).toFixed(1)}px;--d:${Math.max(10,g.ys-my-6).toFixed(1)}px;background:${j.ch.col}`;ws.appendChild(gr);gr.onanimationend=()=>gr.remove()}}
   }
   observe(c);view(c);
  }else{
   if(j.stream){j.stream.remove();j.stream=null}
   if(!j.end)j.end=j.t;
   j.el.style.transform=`translate(${(mx-32).toFixed(1)}px,${(my-10-30).toFixed(1)}px) rotate(-8deg) scale(${s.toFixed(3)})`;j.el.style.opacity=0;
   if(j.t-j.end>.5)endPour(j);
  }
 }
}

function tickMatches(real){

   const mp=mouthWs(c);if(Math.hypot(fx-mp[0],fy-mp[1])>34*(c.sc||1))continue;

 ["Group activity","Dissolve K₂SO₄, NH₄NO₃ and anhydrous CuSO₄ in 25 mL water, and add iron filings to copper sulphate solution. Note each temperature change."]
];

/* ---------- main loop: 10 Hz ---------- */
let lastT=performance.now();
function puff(c,cls,n){const v=c.el.querySelector(".vessel"),g=GEO[c.type];for(let i=0;i<n;i++){const p=document.createElement("i");p.className=cls;p.style.cssText=`left:${f1(g.cx+(Math.random()-.5)*g.hw(g.ytop)*1.3)}px;top:${f1(g.ytop-4)}px`;v.appendChild(p);p.onanimationend=()=>p.remove()}}
setInterval(()=>{
 const now=performance.now(),real=Math.min(.5,(now-lastT)/1000);lastT=now;const dt=real*state.warp;simTime+=dt;
 runPours(real);tickHeating();tickTiltPour(real);tickFrees(real);tickDtubes(dt);tickElectro(dt);tickSun();tickGasWarn(real);
 for(const c of state.items){
  if(c.vol>0||Object.keys(c.sol).length||Object.keys(c.gh).length||c.heatW||c.T>26||c.T<24)tickContainer(c,dt);
  /* displayed colour drifts toward the true colour: slowly when unstirred, quickly when stirred */
  const tg=solnColour(c);if(!c.disp||c.vol<.3)c.disp={rgb:tg.rgb.slice(),alpha:tg.alpha};else{const k=Math.min(1,(c.stir>0?2.8:.45)*real*Math.max(1,state.warp*.6));c.disp={rgb:mix(c.disp.rgb,tg.rgb,k),alpha:c.disp.alpha+(tg.alpha-c.disp.alpha)*k}}
  c.flash=(c.flash||0)*Math.exp(-3*real);
  view(c);readouts(c);
  const rate=Math.max(c.gasRate||0,c.boil?1.6e-4:0,c._xg||0);c._xg=0;
  if(rate>0&&c.vol>.3){let n=Math.min(4,rate/1.2e-4*(.6+Math.random()));n=Math.floor(n)+(Math.random()<n%1?1:0);
   const bl=c.el.querySelector(".bubs");if(bl.children.length<50)for(let i=0;i<n;i++){const bb=document.createElement("span"),z=2+Math.random()*(c.boil?6:5);bb.className="bub";bb.style.cssText=`left:${Math.random()*92}%;width:${z}px;height:${z}px;animation-duration:${(.8+Math.random()*.8)/Math.sqrt(state.warp)}s`;bb.onanimationend=()=>bb.remove();bl.appendChild(bb)}}
  if(c.type==="mug"&&c.sw&&c.eb&&c.vol>20){const bl=c.el.querySelector(".bubs"),G=GEO.mug,w=G.hw(G.ytop)*1.5;if(bl.children.length<60)for(const s of[-1,1])if(Math.random()<(s<0?.9:.5)){const bb=document.createElement("span"),z=2+Math.random()*4;bb.className="bub";bb.style.cssText=`left:${(w/2+s*22-z/2).toFixed(1)}px;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px;animation-duration:${(.8+Math.random()*.5).toFixed(2)}s`;bb.onanimationend=()=>bb.remove();bl.appendChild(bb)}}
  if((c.gh.NO2||0)>1e-7&&!c.cork&&!c.inv&&Math.random()<.5)puff(c,"fume",1);
  if((c.gh.SO3||0)>1e-7&&!c.cork&&!c.inv&&Math.random()<.4)puff(c,"steam",1);
  if(c.T>65&&c.vol>.3&&Math.random()<Math.min(.9,(c.T-60)/40)*(c.boil?1.2:.5))puff(c,"steam",c.boil?2:1);
 }
 for(const b of state.tools)if(b.type==="bunsen"&&b.lit&&!state.gog&&false)b.lit=false;
 tickMatches(real);
 renderPanel(false);
},100);
renderTool();renderPanel(true);
window.LAB={state,frees,dtubes,spawnFree,spawnSand,spawnDtube,toggleHand,toggleSwitch,trySlot,tickHeating,burnerView,moveCtl,mouthWs,vrect,matches,spawnMatchbox,spawnMatch,toggleGas,spawn,spawnBurner,addChem,addNow,startPour,CHEM,tickContainer,view,select,byId,pours};
